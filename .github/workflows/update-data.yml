name: Update stock price data

on:
  schedule:
    # Every 30 min during US market hours (13:00-21:00 UTC), Mon-Fri
    - cron: '*/30 13-21 * * 1-5'
    # Once daily off-hours catch-all, every day
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest price data
        run: python3 fetch_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update price data"
          git push
