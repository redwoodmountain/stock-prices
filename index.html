<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPY – Last 2 Years</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>SPY – Last 2 Years</h1>
    <div id="summary" class="summary"><span class="pill">Loading...</span></div>
    <div id="error" class="error" style="display:none"></div>
    <div id="charts" style="display:none">
      <div class="chart-wrap">
        <canvas id="priceChart"></canvas>
      </div>
      <div class="chart-wrap volume-wrap">
        <canvas id="volumeChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let priceChart, volumeChart;

    function showError(msg) {
      document.getElementById("error").textContent = msg;
      document.getElementById("error").style.display = "block";
      document.getElementById("summary").innerHTML = "";
      document.getElementById("charts").style.display = "none";
    }

    async function loadData() {
      const yahooUrl = "https://query1.finance.yahoo.com/v8/finance/chart/SPY?range=2y&interval=1d";
      const url = "https://corsproxy.io/?" + encodeURIComponent(yahooUrl);

      let json;
      try {
        const res = await fetch(url);
        json = await res.json();
      } catch (e) {
        showError("Network error — check your connection and try again.");
        return;
      }

      const result = json?.chart?.result?.[0];
      if (!result) {
        showError("Failed to load data. Please try refreshing.");
        return;
      }

      const timestamps = result.timestamp;
      const adjCloses = result.indicators.adjclose?.[0]?.adjclose || result.indicators.quote[0].close;
      const volumes = result.indicators.quote[0].volume;

      const dates = [], closes = [], vols = [];
      timestamps.forEach((ts, i) => {
        if (adjCloses[i] == null) return;
        const d = new Date(ts * 1000);
        dates.push(d.toISOString().slice(0, 10));
        closes.push(parseFloat(adjCloses[i].toFixed(2)));
        vols.push(volumes[i] || 0);
      });

      if (dates.length === 0) {
        showError("No data returned. Please try refreshing.");
        return;
      }

      const firstClose = closes[0];
      const lastClose = closes[closes.length - 1];
      const twoYrReturn = ((lastClose - firstClose) / firstClose * 100).toFixed(2);
      const returnColor = twoYrReturn >= 0 ? "positive" : "negative";

      document.getElementById("summary").innerHTML = `
        <span class="pill"><strong>Ticker:</strong> SPY</span>
        <span class="pill"><strong>Range:</strong> ${dates[0]} → ${dates[dates.length - 1]}</span>
        <span class="pill"><strong>Latest Close:</strong> $${lastClose.toFixed(2)}</span>
        <span class="pill ${returnColor}"><strong>2-Year Return:</strong> ${twoYrReturn >= 0 ? "+" : ""}${twoYrReturn}%</span>
      `;

      document.getElementById("charts").style.display = "block";

      if (priceChart) priceChart.destroy();
      if (volumeChart) volumeChart.destroy();

      priceChart = new Chart(document.getElementById("priceChart"), {
        type: "line",
        data: {
          labels: dates,
          datasets: [{
            label: "Adj Close",
            data: closes,
            borderColor: "#4f8ef7",
            backgroundColor: "rgba(79,142,247,0.08)",
            borderWidth: 1.5,
            pointRadius: 0,
            fill: true,
            tension: 0.1,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: { display: true, text: "SPY – Adjusted Close", font: { size: 14 } }
          },
          scales: {
            x: { ticks: { maxTicksLimit: 12 } },
            y: { ticks: { callback: v => "$" + v } }
          }
        }
      });

      volumeChart = new Chart(document.getElementById("volumeChart"), {
        type: "bar",
        data: {
          labels: dates,
          datasets: [{
            label: "Volume",
            data: vols,
            backgroundColor: "rgba(120,120,180,0.4)",
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: { display: true, text: "Volume", font: { size: 14 } }
          },
          scales: {
            x: { ticks: { maxTicksLimit: 12 } },
            y: { ticks: { callback: v => (v / 1e6).toFixed(0) + "M" } }
          }
        }
      });
    }

    loadData();
  </script>
</body>
</html>
