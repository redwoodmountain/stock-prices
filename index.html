<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETF Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">

    <header>
      <h1>ETF Tracker</h1>
      <p class="subtitle">S&amp;P 500 ETF Price Viewer</p>
    </header>

    <div class="controls">
      <div class="btn-group" id="ticker-group">
        <button class="btn active" data-ticker="SPY">SPY</button>
        <button class="btn" data-ticker="VOO">VOO</button>
        <button class="btn" data-ticker="IVV">IVV</button>
        <button class="btn" data-ticker="SPLG">SPLG</button>
      </div>
      <div class="btn-group" id="range-group">
        <button class="btn" data-range="max">Max</button>
        <button class="btn" data-range="5y">5Y</button>
        <button class="btn" data-range="3y">3Y</button>
        <button class="btn active" data-range="2y">2Y</button>
        <button class="btn" data-range="1y">1Y</button>
        <button class="btn" data-range="ytd">YTD</button>
        <button class="btn" data-range="mtd">MTD</button>
        <button class="btn" data-range="today">Today</button>
      </div>
    </div>

    <div class="summary-card" id="summary">
      <div class="stat"><span class="stat-label">Ticker</span><span class="stat-value" id="s-ticker">—</span></div>
      <div class="stat"><span class="stat-label">Timeframe</span><span class="stat-value" id="s-range">—</span></div>
      <div class="stat"><span class="stat-label">From</span><span class="stat-value" id="s-start">—</span></div>
      <div class="stat"><span class="stat-label">To</span><span class="stat-value" id="s-end">—</span></div>
      <div class="stat"><span class="stat-label">Latest Price</span><span class="stat-value" id="s-price">—</span></div>
      <div class="stat"><span class="stat-label">Return</span><span class="stat-value" id="s-return">—</span></div>
    </div>

    <div class="error-banner" id="error" hidden></div>

    <div class="chart-card">
      <canvas id="chart"></canvas>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
