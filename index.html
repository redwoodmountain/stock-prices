<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SP500 Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">

    <header>
      <div class="header-row">
        <h1>SP500 Tracker</h1>
        <button class="info-btn" id="info-btn" aria-label="About these ETFs">?</button>
      </div>
    </header>

    <!-- Info Drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-header">
        <h2>About These ETFs</h2>
        <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
      </div>
      <ul class="ticker-list">
        <li><span class="ticker-tag">SPY</span><span>State Street's oldest, most liquid S&amp;P 500 ETF</span></li>
        <li><span class="ticker-tag">VOO</span><span>Vanguard's low-cost S&amp;P 500 tracker</span></li>
        <li><span class="ticker-tag">IVV</span><span>BlackRock's low-fee S&amp;P 500 ETF</span></li>
        <li><span class="ticker-tag">SPLG</span><span>State Street's lowest-cost S&amp;P 500 ETF</span></li>
      </ul>
    </aside>

    <div class="controls">
      <div class="btn-group" id="ticker-group">
        <button class="btn active" data-ticker="SPY">SPY</button>
        <button class="btn" data-ticker="VOO">VOO</button>
        <button class="btn" data-ticker="IVV">IVV</button>
        <button class="btn" data-ticker="SPLG">SPLG</button>
      </div>
      <div class="btn-group" id="range-group">
        <button class="btn" data-range="max">Max</button>
        <button class="btn" data-range="5y">5Y</button>
        <button class="btn" data-range="3y">3Y</button>
        <button class="btn active" data-range="2y">2Y</button>
        <button class="btn" data-range="1y">1Y</button>
        <button class="btn" data-range="ytd">YTD</button>
        <button class="btn" data-range="mtd">MTD</button>
        <button class="btn" data-range="today">Today</button>
      </div>
    </div>

    <div class="summary-card" id="summary">
      <div class="stat"><span class="stat-label">Ticker</span><span class="stat-value" id="s-ticker">—</span></div>
      <div class="stat"><span class="stat-label">Timeframe</span><span class="stat-value" id="s-range">—</span></div>
      <div class="stat"><span class="stat-label">From</span><span class="stat-value" id="s-start">—</span></div>
      <div class="stat"><span class="stat-label">To</span><span class="stat-value" id="s-end">—</span></div>
      <div class="stat"><span class="stat-label">Latest Price</span><span class="stat-value" id="s-price">—</span></div>
      <div class="stat"><span class="stat-label">Return</span><span class="stat-value" id="s-return">—</span></div>
    </div>

    <div class="error-banner" id="error" hidden></div>

    <div class="chart-card">
      <canvas id="chart"></canvas>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
